<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="记录走过的街巷，复刻真实发生的城市路线。">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <title>城迹 CityTrace</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="side-rail">
      <a class="brand" href="#/discover" aria-label="城迹首页"><span class="brand-mark">c<span>·</span></span><span>城迹 <small>CITYTRACE</small></span></a>
      <div class="rail-caption">你的城市漫游</div>
      <nav class="primary-nav" aria-label="主要导航">
        <a href="#/discover" data-nav="discover"><span class="nav-icon">⌕</span>发现</a>
        <a href="#/map" data-nav="map"><span class="nav-icon">⌖</span>地图</a>
        <a href="#/record" data-nav="record"><span class="nav-icon">◎</span>记录</a>
        <a href="#/trips" data-nav="trips"><span class="nav-icon">↗</span>行程</a>
        <a href="#/profile" data-nav="profile"><span class="nav-icon">◉</span>我的</a>
      </nav>
      <div class="rail-note"><span class="note-dot"></span><div><strong>真实走过的路</strong><p>每一条路线，都是一段生活。</p></div></div>
      <div class="rail-bottom"><span class="avatar avatar-small" id="rail-avatar">迹</span><span id="rail-user">游客漫游中</span><button class="icon-button quiet" id="rail-login" aria-label="登录">↗</button></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark">c<span>·</span></span><b>城迹</b></div>
        <div class="crumb" id="crumb">发现 <span>/</span> 沿着城市慢慢走</div>
        <div class="top-actions"><span class="today-label" id="today-label"></span><button id="top-login" class="button button-dark button-small">登录 / 注册</button><button id="top-profile" class="avatar avatar-button hidden" title="个人中心">迹</button></div>
      </header>
      <section class="page-wrap" id="app" aria-live="polite"><div class="loading"><span class="spinner"></span> 正在打开城迹…</div></section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="移动端导航">
    <a href="#/discover" data-nav="discover"><span>⌕</span><small>发现</small></a>
    <a href="#/map" data-nav="map"><span>⌖</span><small>地图</small></a>
    <a class="record-nav" href="#/record" data-nav="record"><span>◎</span><small>记录</small></a>
    <a href="#/trips" data-nav="trips"><span>↗</span><small>行程</small></a>
    <a href="#/profile" data-nav="profile"><span>◉</span><small>我的</small></a>
  </nav>
  <div id="modal-root"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
  <script src="/static/v2.js" defer></script>
</body>
</html>
