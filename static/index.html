<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6ef">
  <meta name="description" content="记录走过的街巷，复刻真实发生的城市路线。">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <title>城迹 CityTrace</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到页面内容</a>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;overflow:hidden">
    <defs>
      <symbol id="icon-discover" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.7 8.3-2 5.4-5.4 2 2-5.4 5.4-2Z"/></symbol>
      <symbol id="icon-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5Z"/><path d="M9 3v16m6-14v16"/></symbol>
      <symbol id="icon-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></symbol>
      <symbol id="icon-trips" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M8 5h7a4 4 0 0 1 0 8H9a3 3 0 0 0 0 6h7"/></symbol>
      <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21v-1a7.5 7.5 0 0 1 15 0v1"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
    </defs>
  </svg>
  <div class="app-shell">
    <aside class="side-rail" aria-label="城迹主导航">
      <a class="brand" href="#/discover" aria-label="城迹首页"><span class="brand-mark" aria-hidden="true">c<span>·</span></span><span>城迹 <small>CITYTRACE</small></span></a>
      <div class="rail-caption">你的城市漫游</div>
      <nav class="primary-nav" aria-label="主要导航">
        <a href="#/discover" data-nav="discover"><span class="nav-icon" aria-hidden="true"><svg><use href="#icon-discover"/></svg></span>发现</a>
        <a href="#/map" data-nav="map"><span class="nav-icon" aria-hidden="true"><svg><use href="#icon-map"/></svg></span>地图</a>
        <a href="#/record" data-nav="record"><span class="nav-icon" aria-hidden="true"><svg><use href="#icon-record"/></svg></span>记录</a>
        <a href="#/trips" data-nav="trips"><span class="nav-icon" aria-hidden="true"><svg><use href="#icon-trips"/></svg></span>行程</a>
        <a href="#/profile" data-nav="profile"><span class="nav-icon" aria-hidden="true"><svg><use href="#icon-profile"/></svg></span>我的</a>
      </nav>
      <div class="rail-note"><span class="note-dot" aria-hidden="true"></span><div><strong>真实走过的路</strong><p>每一条路线，都是一段生活。</p></div></div>
      <div class="rail-bottom"><span class="avatar avatar-small" id="rail-avatar" aria-hidden="true">迹</span><span id="rail-user">游客漫游中</span><button class="icon-button quiet" id="rail-login" aria-label="登录"><svg aria-hidden="true"><use href="#icon-arrow"/></svg></button></div>
    </aside>

    <main class="main-area" id="main-content" tabindex="-1">
      <header class="topbar">
        <a class="mobile-brand" href="#/discover" aria-label="城迹首页"><span class="brand-mark" aria-hidden="true">c<span>·</span></span><b>城迹</b></a>
        <div class="crumb" id="crumb">发现 <span>/</span> 沿着城市慢慢走</div>
        <div class="top-actions"><span class="today-label" id="today-label"></span><button id="top-login" class="button button-dark button-small">登录 / 注册</button><button id="top-profile" class="avatar avatar-button hidden" aria-label="打开个人中心" title="个人中心">迹</button></div>
      </header>
      <div class="app-status hidden" id="app-status" role="status" aria-live="polite"></div>
      <aside class="active-journey hidden" id="active-journey" aria-label="正在进行的行程"></aside>
      <section class="page-wrap" id="app" aria-busy="true"><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span> 正在打开城迹…</div></section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="移动端导航">
    <a href="#/discover" data-nav="discover"><span aria-hidden="true"><svg><use href="#icon-discover"/></svg></span><small>发现</small></a>
    <a href="#/map" data-nav="map"><span aria-hidden="true"><svg><use href="#icon-map"/></svg></span><small>地图</small></a>
    <a class="record-nav" href="#/record" data-nav="record"><span aria-hidden="true"><svg><use href="#icon-record"/></svg></span><small>记录</small></a>
    <a href="#/trips" data-nav="trips"><span aria-hidden="true"><svg><use href="#icon-trips"/></svg></span><small>行程</small></a>
    <a href="#/profile" data-nav="profile"><span aria-hidden="true"><svg><use href="#icon-profile"/></svg></span><small>我的</small></a>
  </nav>
  <div id="modal-root"></div>
  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>
  <script src="/static/app.js" defer></script>
  <script src="/static/v2.js" defer></script>
</body>
</html>
